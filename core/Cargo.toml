[package]
name = "ys-shimcache-parser-core"
version = "1.0.0"
edition.workspace = true
rust-version.workspace = true
description = "Windows AppCompatCache (ShimCache) values, Windows XP to 11, decoded as Eric Zimmerman's AppCompatCacheParser does: every entry's path, last-modification time, execution flag, flags, data and packaged-app record; damaged entries reported, entries recovered from the slack, never a panic."
license.workspace = true
authors.workspace = true
keywords = ["forensics", "shimcache", "appcompatcache", "windows", "dfir"]
categories = ["parser-implementations"]
repository.workspace = true
homepage.workspace = true
publish.workspace = true
readme.workspace = true
exclude = ["tests/data/", "fuzz/"]

# The library keeps its name, so code using it reads `use shimcache_core::…`.
[lib]
name = "shimcache_core"

[dependencies]

[dev-dependencies]
serde_json = "1"

[lints]
workspace = true
