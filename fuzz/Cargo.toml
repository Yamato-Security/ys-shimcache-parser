[package]
name = "shimcache-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
libfuzzer-sys = "0.4"
shimcache-core = { package = "ys-shimcache-parser-core", path = "../core" }
shimcache-forensic = { package = "ys-shimcache-parser", path = "../forensic" }

[[bin]]
name = "fuzz_parse"
path = "fuzz_targets/fuzz_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_forensic"
path = "fuzz_targets/fuzz_forensic.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_hive"
path = "fuzz_targets/fuzz_hive.rs"
test = false
doc = false
bench = false
