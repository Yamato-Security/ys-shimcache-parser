[package]
name = "ys-shimcache-parser"
version = "1.0.0"
edition.workspace = true
rust-version.workspace = true
description = "SYSTEM hives' AppCompatCaches: its own registry reader (transaction logs replayed, every control set, value slack) and the ys-shimcache-parser command, with CSV output and graded findings."
license.workspace = true
authors.workspace = true
keywords = ["forensics", "shimcache", "appcompatcache", "windows", "dfir"]
categories = ["command-line-utilities", "parser-implementations"]
repository.workspace = true
homepage.workspace = true
publish.workspace = true
readme.workspace = true

# The library keeps its name, so code using it reads `use shimcache_forensic::…`.
[lib]
name = "shimcache_forensic"

[dependencies]
shimcache-core = { workspace = true }
forensicnomicon = { workspace = true }

[dev-dependencies]
serde_json = "1"
flate2 = "1"

[lints]
workspace = true
